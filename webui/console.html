<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anvil 工单控制台</title>
<style>
:root {
  --bg: #0f1117; --panel: #161a23; --panel2: #1c212d; --line: #2a3040;
  --txt: #e4e7ef; --dim: #8b93a7; --acc: #4f8cff; --ok: #3ecf8e; --warn: #f5a623;
  --err: #ff6b6b; --mono: "Cascadia Code", Consolas, "Courier New", monospace;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--txt); font: 14px/1.65 "Segoe UI", "Microsoft YaHei", sans-serif; min-height: 100vh; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 20px 24px 60px; }

header { display: flex; align-items: baseline; gap: 14px; padding: 6px 0 18px; border-bottom: 1px solid var(--line); margin-bottom: 20px; flex-wrap: wrap; }
header h1 { font-size: 21px; font-weight: 650; letter-spacing: .3px; }
header h1 .mark { color: var(--acc); }
header .sub { color: var(--dim); font-size: 12.5px; }
header .spacer { flex: 1; }
#connDot { width: 9px; height: 9px; border-radius: 50%; background: var(--err); display: inline-block; margin-right: 6px; vertical-align: 1px; }
#connDot.ok { background: var(--ok); }

.grid { display: grid; grid-template-columns: 400px 1fr; gap: 18px; }
@media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.panel-h { padding: 11px 16px; border-bottom: 1px solid var(--line); font-weight: 600; font-size: 13.5px; display: flex; align-items: center; gap: 8px; background: var(--panel2); }
.panel-h .tag { font-size: 11px; color: var(--dim); font-weight: 400; margin-left: auto; }
.panel-b { padding: 16px; }

label { display: block; font-size: 12px; color: var(--dim); margin: 12px 0 5px; }
label:first-child { margin-top: 0; }
input[type=text], textarea, select {
  width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 7px;
  color: var(--txt); padding: 8px 11px; font: inherit; outline: none; transition: border-color .15s;
}
input[type=text]:focus, textarea:focus, select:focus { border-color: var(--acc); }
textarea { resize: vertical; min-height: 84px; font-family: var(--mono); font-size: 12.5px; }
select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--dim) 50%), linear-gradient(135deg, var(--dim) 50%, transparent 50%); background-position: calc(100% - 16px) 55%, calc(100% - 11px) 55%; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 30px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

.chk { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: 13px; color: var(--txt); cursor: pointer; user-select: none; }
.chk input { accent-color: var(--acc); width: 15px; height: 15px; }
.chk .hint { color: var(--dim); font-size: 11.5px; }

button {
  background: var(--acc); border: none; border-radius: 7px; color: #fff; padding: 9px 18px;
  font: 600 13.5px/1 "Segoe UI", "Microsoft YaHei", sans-serif; cursor: pointer; transition: filter .12s, opacity .12s;
}
button:hover { filter: brightness(1.12); }
button:active { filter: brightness(.92); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.ghost { background: transparent; border: 1px solid var(--line); color: var(--dim); }
button.ghost:hover { color: var(--txt); border-color: var(--dim); }
button.ok-btn { background: var(--ok); color: #06281a; }
button.danger { background: transparent; border: 1px solid var(--err); color: var(--err); }

#submitBar { margin-top: 18px; display: flex; gap: 10px; align-items: center; }
#submitBar .err-msg { color: var(--err); font-size: 12px; min-height: 16px; }

/* 工单列表 */
#wolist { list-style: none; }
#wolist li { display: flex; align-items: center; gap: 10px; padding: 9px 16px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background .12s; }
#wolist li:last-child { border-bottom: none; }
#wolist li:hover { background: var(--panel2); }
#wolist li.sel { background: var(--panel2); box-shadow: inset 3px 0 0 var(--acc); }
#wolist .wo-id { font-family: var(--mono); font-size: 12px; color: var(--acc); }
#wolist .wo-task { flex: 1; color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st { font-size: 11px; padding: 2px 8px; border-radius: 10px; font-weight: 600; white-space: nowrap; }
.st-running { background: #14324d; color: #6db3ff; }
.st-awaiting_confirm { background: #3d3010; color: var(--warn); }
.st-done { background: #103527; color: var(--ok); }
.st-failed, .st-security_abort { background: #3d1818; color: var(--err); }
.st-escalated, .st-needs_input { background: #332410; color: var(--warn); }
.empty { padding: 26px 16px; text-align: center; color: var(--dim); font-size: 12.5px; }

/* 详情 */
#detail .panel-b { padding: 0; }
.d-sec { padding: 14px 18px; border-bottom: 1px solid var(--line); }
.d-sec:last-child { border-bottom: none; }
.d-title { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.d-title .wo-id { font-family: var(--mono); font-size: 13px; color: var(--acc); }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px 16px; margin-top: 10px; font-size: 12.5px; }
.kv b { color: var(--dim); font-weight: 400; display: block; font-size: 11px; }
.kv span { font-family: var(--mono); font-size: 12px; }

.timeline { list-style: none; max-height: 300px; overflow-y: auto; }
.timeline li { position: relative; padding: 3px 0 3px 20px; font-size: 12.5px; font-family: var(--mono); color: var(--dim); }
.timeline li::before { content: ""; position: absolute; left: 4px; top: 10px; width: 7px; height: 7px; border-radius: 50%; background: var(--line); }
.timeline li.ok::before { background: var(--ok); }
.timeline li.bad::before { background: var(--err); }
.timeline li.cur::before { background: var(--acc); box-shadow: 0 0 0 3px #4f8cff33; }
.timeline li b { color: var(--txt); font-weight: 600; }

pre.code { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 13px 15px; font: 12px/1.6 var(--mono); overflow-x: auto; max-height: 340px; overflow-y: auto; white-space: pre; }
pre.code .add { color: var(--ok); }
pre.code .del { color: var(--err); }
pre.code .ctx { color: #555e73; }

.actions { display: flex; gap: 10px; padding: 14px 18px; flex-wrap: wrap; }
.actions .note { font-size: 11.5px; color: var(--dim); align-self: center; }

/* 演示条 */
#demoBar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
#demoBar button { font-size: 12.5px; padding: 7px 14px; }

footer { margin-top: 26px; color: var(--dim); font-size: 11.5px; text-align: center; }
footer code { font-family: var(--mono); color: var(--acc); }

::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: #3a4256; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="mark">▲</span> Anvil 工单控制台</h1>
    <span class="sub">本地状态机 · 三 gate 验收 · 人确认落盘</span>
    <span class="spacer"></span>
    <span class="sub"><span id="connDot"></span><span id="connTxt">未连接</span></span>
  </header>

  <div id="demoBar">
    <button class="ghost" onclick="fillDemo('code')">演示①：代码工单（calc 平均值）</button>
    <button class="ghost" onclick="fillDemo('visual')">演示②：视觉工单（看图分类）</button>
    <button class="ghost" onclick="fillDemo('hr')">演示③：带项目记忆（HR）</button>
  </div>

  <div class="grid">
    <!-- 左列：建单 + 工单列表 -->
    <div style="display:flex; flex-direction:column; gap:18px;">
      <div class="panel">
        <div class="panel-h">新建工单 <span class="tag">POST /wo</span></div>
        <div class="panel-b">
          <label>任务描述（给模型看的自然语言）</label>
          <textarea id="f_task" placeholder="例：在 calc.py 中实现 average(nums)：空列表返回 0.0，否则返回平均值。确保测试全部通过。"></textarea>
          <div class="row2">
            <div>
              <label>沙箱目录（workdir，绝对路径）</label>
              <input type="text" id="f_workdir" placeholder="C:\anvil-demo">
            </div>
            <div>
              <label>目标文件（相对 workdir）</label>
              <input type="text" id="f_target" placeholder="calc.py">
            </div>
          </div>
          <div class="row2">
            <div>
              <label>测试文件（可选）</label>
              <input type="text" id="f_test" placeholder="test_calc.py">
            </div>
            <div>
              <label>模型（适配层画像）</label>
              <select id="f_adapter">
                <option value="qwen3.5">qwen3.5:9b（考核主力 · 推荐）</option>
                <option value="mythos">mythos-v2-8b（基线）</option>
                <option value="qwen-coder">qwen2.5-coder:7b（最快）</option>
                <option value="qwen3-8b">qwen3:8b</option>
                <option value="gemma4">gemma4:e4b（带视觉）</option>
              </select>
            </div>
          </div>
          <label class="chk" style="margin-top:14px">
            <input type="checkbox" id="f_visual">
            视觉工单（装载 visual_query）
            <span class="hint">工单级授权：模型可调用 SVSG 看沙箱内图片</span>
          </label>
          <div id="submitBar">
            <button id="btnCreate" onclick="createWo()">创建工单</button>
            <button class="ghost" onclick="refreshList()">刷新列表</button>
            <span class="err-msg" id="createErr"></span>
          </div>
        </div>
      </div>

      <div class="panel">
        <div class="panel-h">工单列表 <span class="tag">GET /wo</span></div>
        <ul id="wolist"><li class="empty">暂无工单——先建一个，或点上方演示按钮</li></ul>
      </div>
    </div>

    <!-- 右列：详情 -->
    <div class="panel" id="detail">
      <div class="panel-h">工单详情 <span class="tag" id="detailTag">未选择</span></div>
      <div class="panel-b" id="detailBody">
        <div class="empty" style="padding:60px 16px;">选中左侧工单查看：<br>节点时间线 · gate 结果 · diff 预览 · 确认/取消操作</div>
      </div>
    </div>
  </div>

  <footer>
    服务地址 <code id="svcUrl">http://127.0.0.1:8099</code> · 令牌读 <code>runtime/service-token</code> ·
    全链只连本机（Ollama 11434 / HR 8001 / SVSG 3002）
  </footer>
</div>

<script>
"use strict";
// ============ 配置 ============
const CFG_KEY = "anvil_console_cfg";
let CFG = loadCfg();
function loadCfg() {
  try { return JSON.parse(localStorage.getItem(CFG_KEY) || "{}"); } catch { return {}; }
}
function saveCfg() { localStorage.setItem(CFG_KEY, JSON.stringify(CFG)); }

// ============ API 封装 ============
let TOKEN = "";
async function api(method, path, body) {
  const headers = { "Content-Type": "application/json" };
  if (TOKEN) headers["X-Local-Ide-Token"] = TOKEN;
  const r = await fetch(CFG.svc + path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  let data = null;
  try { data = await r.json(); } catch {}
  return { code: r.status, data };
}

// ============ 连接 ============
async function connect() {
  const dot = document.getElementById("connDot"), txt = document.getElementById("connTxt");
  // 令牌：service 把 token 写在 runtime/service-token（相对 service 启动目录）
  // 控制台侧让用户粘贴一次（或从同源 fetch 不了——file:// 页面无法读本地文件）
  if (!CFG.token) {
    dot.className = ""; txt.textContent = "需要令牌";
    return false;
  }
  TOKEN = CFG.token;
  const { code, data } = await api("GET", "/health");
  if (code === 200 && data) {
    dot.className = "ok"; txt.textContent = "已连接 " + (data.version || "");
    return true;
  }
  dot.className = ""; txt.textContent = "连接失败";
  return false;
}

function askToken() {
  const t = prompt("粘贴服务令牌（service 启动目录下 runtime/service-token 文件内容）：", CFG.token || "");
  if (t !== null) { CFG.token = t.trim(); saveCfg(); location.reload(); }
}
document.getElementById("connTxt").addEventListener("click", askToken);
document.getElementById("svcUrl").textContent = CFG.svc || "http://127.0.0.1:8099";
if (!CFG.svc) { CFG.svc = "http://127.0.0.1:8099"; saveCfg(); }

// ============ 演示填充 ============
const DEMOS = {
  code: {
    task: "在 calc.py 中实现 average(nums) 函数：返回整数列表的平均值，空列表返回 0.0。把 average 现有的函数体替换掉（不要留下旧代码）；确保测试全部通过。",
    workdir: "C:\\anvil-demo", target: "calc.py", test: "test_calc.py", visual: false,
  },
  visual: {
    task: "在 vision_classify.py 中实现 classify_image(path)：先调用 visual_query 工具查看 sample/bus.jpg 确认图片实际内容（硬性要求，不看图写出来的分类没有依据），然后按实际内容实现：公交/机动车场景返回 'vehicle'，其它返回 'other'。文件不存在等异常返回 'other'。确保测试全部通过。",
    workdir: "C:\\anvil-demo-visual", target: "vision_classify.py", test: "test_vision_classify.py", visual: true,
  },
  hr: {
    task: "修改 tools.py 的 apply_patch：支持把补丁参数包在 patch 嵌套对象里的调用形态（有的模型会传 patch={old_string,new_string} 而不是扁平参数）。注意保持写范围约束与乐观并发语义不变。",
    workdir: "C:\\Users\\匡溯昀\\Desktop\\本地工作流\\Anvil\\core\\statemachine", target: "tools.py", test: "", visual: false,
  },
};
function fillDemo(kind) {
  const d = DEMOS[kind];
  document.getElementById("f_task").value = d.task;
  document.getElementById("f_workdir").value = d.workdir;
  document.getElementById("f_target").value = d.target;
  document.getElementById("f_test").value = d.test;
  document.getElementById("f_visual").checked = d.visual;
  document.getElementById("f_adapter").value = "qwen3.5";
  note(kind === "hr" ? "演示③说明：HR 会自动检索项目知识注入（需 HR 服务在 8001 在线）。演示前先用准备脚本造沙箱。" :
        kind === "visual" ? "演示②说明：需先造视觉沙箱（bus.jpg + 待实现文件）。模型必须先看图才能写对。" :
        "演示①说明：需先造 calc 沙箱（calc.py + test_calc.py）。");
}
function note(msg) { document.getElementById("createErr").textContent = msg || ""; }

// ============ 建单 ============
async function createWo() {
  const err = document.getElementById("createErr");
  err.textContent = "";
  const task = document.getElementById("f_task").value.trim();
  const workdir = document.getElementById("f_workdir").value.trim();
  const target = document.getElementById("f_target").value.trim();
  CFG.adapter = document.getElementById("f_adapter").value;
  saveCfg();
  if (!task || !workdir || !target) { err.textContent = "任务、沙箱目录、目标文件都必填"; return; }
  if (!TOKEN) { err.textContent = "先点右上角「需要令牌」配置令牌"; return; }
  const btn = document.getElementById("btnCreate");
  btn.disabled = true; btn.textContent = "创建中…";
  const body = {
    kind: "code", task, workdir, target,
    test_path: document.getElementById("f_test").value.trim(),
    adapter: document.getElementById("f_adapter").value,
    visual_tasks: document.getElementById("f_visual").checked,
    require_confirm: true,
  };
  CFG.lastTarget = target; saveCfg();
  const { code, data } = await api("POST", "/wo", body);
  btn.disabled = false; btn.textContent = "创建工单";
  if (code !== 200) { err.textContent = "建单失败：" + JSON.stringify(data); return; }
  refreshList().then(() => selectWo(data.wo_id));
}

// ============ 列表 ============
let SEL = null;
async function refreshList() {
  if (!TOKEN) return;
  const { code, data } = await api("GET", "/wo");
  if (code !== 200) return;
  const ul = document.getElementById("wolist");
  const items = (data && data.items) || [];
  if (!items.length) { ul.innerHTML = '<li class="empty">暂无工单</li>'; return; }
  ul.innerHTML = items.map(w =>
    `<li onclick="selectWo('${w.wo_id}')" class="${SEL === w.wo_id ? "sel" : ""}">
       <span class="wo-id">${w.wo_id.slice(0, 14)}</span>
       <span class="wo-task">${esc(w.task)}</span>
       <span class="st st-${w.status}">${stZh(w.status)}</span>
     </li>`).join("");
}
function stZh(s) {
  return { running: "运行中", awaiting_confirm: "待确认", done: "已完成", failed: "失败",
           escalated: "降级人审", needs_input: "需补信息", security_abort: "安全终止" }[s] || s;
}
function esc(s) { return (s || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

// ============ 详情 ============
let POLL = null;
async function selectWo(woId) {
  SEL = woId;
  clearInterval(POLL);
  await renderDetail();
  refreshList();
  POLL = setInterval(async () => {
    if (!SEL) return;
    const { code, data } = await api("GET", "/wo/" + SEL);
    if (code === 200 && data && (data.status === "running" || data.status === "pending")) renderDetail();
    else if (code === 200) { renderDetail(); clearInterval(POLL); }
  }, 3000);
}

async function renderDetail() {
  if (!SEL) return;
  const { code, data } = await api("GET", "/wo/" + SEL);
  const body = document.getElementById("detailBody");
  const tag = document.getElementById("detailTag");
  if (code !== 200 || !data) { body.innerHTML = '<div class="empty">读取失败</div>'; return; }
  tag.textContent = data.status ? stZh(data.status) : "";
  const r = data.result || data;
  const gates = r.gates || data.gates || [];
  const hist = r.history || data.history || [];
  const violations = r.violations || data.violations || [];
  const elapsed = r.elapsed || data.elapsed;
  const patchesN = hist.some(h => h.kind === "tool" && h.tool === "apply_patch")
    ? hist.filter(h => h.tool === "apply_patch").length : 0;
  const woTask = data.task || r.task || "";
  const woTarget = CFG.lastTarget || "";

  let html = `
    <div class="d-sec">
      <div class="d-title">
        <span class="wo-id">${data.wo_id || SEL}</span>
        <span class="st st-${data.status}">${stZh(data.status)}</span>
        <span style="color:var(--dim);font-size:12px">${elapsed ? elapsed + "s" : ""}</span>
      </div>
      <div class="kv">
        <div><b>目标</b><span>${esc(woTarget)}</span></div>
        <div><b>模型</b><span>${esc(CFG.adapter || "qwen3.5")}</span></div>
        <div><b>补丁数</b><span>${patchesN}</span></div>
        <div><b>visual_query</b><span>${hist.some(h => h.tool === "visual_query") ? "✓ 已调用" : "—"}</span></div>
      </div>
      <p style="margin-top:10px;font-size:12.5px;color:var(--dim)">${esc(woTask.slice(0, 160))}</p>
    </div>`;

  // 时间线
  if (hist.length) {
    html += `<div class="d-sec"><b style="font-size:12.5px;color:var(--dim)">节点时间线（${hist.length} 步）</b>
      <ul class="timeline" style="margin-top:8px">` +
      hist.map(h => `<li class="${h.ok ? "ok" : "bad"}"><b>${h.node}</b> ${esc(h.tool || h.kind || "")} ${esc((h.detail || "").slice(0, 90))}</li>`).join("") +
      `</ul></div>`;
  }

  // gates
  if (gates.length) {
    html += `<div class="d-sec"><b style="font-size:12.5px;color:var(--dim)">gate 结果</b><div class="kv" style="margin-top:8px">` +
      gates.map(g => `<div><b>${g.gate}</b><span class="${g.signal === "ok" ? "" : "err"}" style="color:${g.signal === "ok" ? "var(--ok)" : "var(--err)"}">${g.signal} · 轮次 ${g.round}</span></div>`).join("") +
      `</div></div>`;
  }

  // 违规
  if (violations.length) {
    html += `<div class="d-sec"><b style="font-size:12.5px;color:var(--warn)">⚠ 结构性违规（${violations.length}）</b><ul class="timeline" style="margin-top:6px">` +
      violations.map(v => `<li class="bad"><b>${v.rule}</b> ${esc((v.detail || "").slice(0, 100))}</li>`).join("") + `</ul></div>`;
  }

  // diff（待确认时拉）
  if (data.status === "awaiting_confirm") {
    const st = await api("GET", `/wo/${SEL}/staged`);
    if (st.code === 200 && st.data && st.data.diff) {
      html += `<div class="d-sec"><b style="font-size:12.5px;color:var(--dim)">变更预览（${esc(st.data.filename)}）</b>
        <pre class="code" style="margin-top:8px">${colorDiff(st.data.diff)}</pre></div>`;
    }
    html += `<div class="actions">
      <button class="ok-btn" onclick="confirmWo(true)">✓ 确认落盘</button>
      <button class="danger" onclick="confirmWo(false)">✗ 拒绝</button>
      <span class="note">未确认前，真实文件字节级不变</span>
    </div>`;
  } else if (data.status === "running") {
    html += `<div class="actions"><button class="danger" onclick="cancelWo()">取消工单</button>
      <span class="note">运行中，每 3s 自动刷新</span></div>`;
  }
  body.innerHTML = html;
}

function colorDiff(diff) {
  return esc(diff).split("\n").map(l => {
    if (l.startsWith("+") && !l.startsWith("+++")) return `<span class="add">${l}</span>`;
    if (l.startsWith("-") && !l.startsWith("---")) return `<span class="del">${l}</span>`;
    if (l.startsWith("@@")) return `<span class="ctx">${l}</span>`;
    return l;
  }).join("\n");
}

async function confirmWo(ok) {
  if (!SEL) return;
  const { code, data } = await api("POST", `/wo/${SEL}/confirm`, { approve: ok });
  alert(code === 200 && data.ok ? (ok ? "已落盘" : "已拒绝") : "操作失败：" + JSON.stringify(data));
  renderDetail(); refreshList();
}
async function cancelWo() {
  if (!SEL) return;
  await api("POST", `/wo/${SEL}/cancel`, {});
  clearInterval(POLL);
  renderDetail(); refreshList();
}

// ============ 启动 ============
connect().then(ok => { if (ok) refreshList(); });
</script>
</body>
</html>
