# 单进程入口：python anvil.py；无需启动 HR :8001 / SVSG :3002 / gateway :8098
[models]
ollama = "http://127.0.0.1:11434"
code = "qwen2.5-coder:7b"
adapter = "qwen-coder"
vision = "qwen2.5vl:7b"
embedding = "bge-m3:latest"
embedding_dim = 1024

[limits]
model_calls = 16
vision_requests = 2
output_tokens = 2048
model_timeout = 180
# 本机多模型切换时批嵌入实测接近 60 秒，留出冷启动余量；入库在后台执行。
memory_timeout = 120
vision_timeout = 120
image_bytes = 16777216

[vision]
# yolo 使用本地权重，缺失时明确失败，禁止隐式下载。
detector = "yolo"
weights = ".runtime/models/yolov8n.pt"

[service]
# 超额建单返回 429；仅淘汰已结束工单，待确认工单不会被自动丢弃。
max_active = 4
max_retained = 100

[inference]
# 本地代码、视觉、记忆共享推理槽位；排队计入原调用超时预算。
max_parallel = 1
max_waiting = 32
# 前台优先，但最多连续放行 8 个前台请求后让后台入库获得一次机会。
foreground_burst = 8
